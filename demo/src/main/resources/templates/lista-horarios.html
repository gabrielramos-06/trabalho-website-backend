<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Horários</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 40px; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 800px; margin: auto; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background-color: #007bff; color: white; }
        .btn { padding: 8px 12px; text-decoration: none; border-radius: 4px; color: white; font-size: 14px; }
        .btn-novo { background-color: #28a745; display: inline-block; margin-bottom: 15px; }
        .btn-editar { background-color: #ffc107; color: black; }
        .btn-excluir { background-color: #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gerenciar Horários</h1>
        <a th:href="@{/horarios/novo}" class="btn btn-novo">+ Novo Horário</a>
        <table>
            <tr>
                <th>Dia</th>
                <th>Início - Fim</th>
                <th>Professor</th>
                <th>Disciplina</th>
                <th>Turma</th>
                <th>Ações</th>
            </tr>
            <tr th:each="h : ${horarios}">
                <td th:text="${h.diaSemana}"></td>
                <td th:text="${h.horaInicio} + ' - ' + ${h.horaFim}"></td>
                <td th:text="${h.professor.nome}"></td>
                <td th:text="${h.disciplina.nome}"></td>
                <td th:text="${h.turma.codigo}"></td>
                <td>
                    <a th:href="@{/horarios/editar/{id}(id=${h.id})}" class="btn btn-editar">Editar</a>
                    <a th:href="@{/horarios/excluir/{id}(id=${h.id})}" class="btn btn-excluir">Excluir</a>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
