<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Professor</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 40px; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        input[type="text"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-salvar { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .erro { color: red; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cadastro de Professor</h1>
        
        <form th:action="@{/professores/salvar}" th:object="${professor}" method="post">
            <input type="hidden" th:field="*{id}">
            
            <label>Nome do Professor:</label>
            <input type="text" th:field="*{nome}" placeholder="Digite o nome completo">
            <p th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="erro"></p>
            
            <button type="submit" class="btn-salvar">Salvar</button>
        </form>
        <br>
        <a href="/professores">Voltar para a lista</a>
    </div>
</body>
</html>
